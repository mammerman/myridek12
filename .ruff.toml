# The contents of this file is based on https://github.com/home-assistant/core/blob/dev/pyproject.toml

target-version = "py314"

[lint]
select = [
    "ALL",
]

ignore = [
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "D203", # no-blank-line-before-class (incompatible with formatter)
    "D212", # multi-line-summary-first-line (incompatible with formatter)
    "COM812", # incompatible with formatter
    "ISC001", # incompatible with formatter
    "CPY001", # Missing copyright notice - no notice-rgx configured; upstream's own
              # integration_blueprint reference code doesn't satisfy this rule either
]

[lint.per-file-ignores]
# Test asserts, magic numbers in fixtures, private-member access for
# whitebox testing, and missing docstrings/annotations on test functions are
# all normal in a test suite - this mirrors Home Assistant core's own
# pyproject.toml, which relaxes the same rules for its tests/ directory.
"tests/*" = [
    "S101", "ANN001", "ANN201", "ANN202", "D100", "D101", "D102", "D103", "D104",
    "PLR2004", "SLF001", "ARG001", "ARG002", "PLC0415", "FBT001", "TC001", "TC003",
]
# CONF_* constants are config *keys*, not secret values - ruff's heuristic
# false-positives on the word "token" in the key name itself.
"const.py" = ["S105"]
# Error messages here carry real diagnostic value (HTTP status, response
# body) that TRY003/EM101/EM102's "extract to a variable" preference would
# only obscure for debugging a third-party API we don't control.
"api.py" = ["TRY003", "EM101", "EM102"]

[lint.flake8-pytest-style]
fixture-parentheses = false

[lint.pyupgrade]
keep-runtime-typing = true

[lint.mccabe]
max-complexity = 25
